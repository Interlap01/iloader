# Builds iloader-cli for Linux and Windows when a cli-vN tag is pushed, and
# attaches both to a draft release cli-vN. The macOS binaries are signed and
# notarized on a Mac and uploaded to the same draft, which then gets its
# manifest.json and is published.
#
# Run by hand (workflow_dispatch) with a build number to try the builds
# without a tag; the binaries are then only kept as workflow artifacts.

name: cli release

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      build:
        description: release number to stamp into --version
        required: true
        default: '0'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
            asset: iloader-cli-linux-amd64
          - platform: windows-amd64
            os: windows-latest
            asset: iloader-cli-windows-amd64.exe
    env:
      ILOADER_CLI_BUILD: ${{ github.event_name == 'push' && github.ref_name || inputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: build number
        shell: bash
        run: |
          set -euo pipefail
          n="${ILOADER_CLI_BUILD#cli-v}"
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::build '$ILOADER_CLI_BUILD' is not cli-vN or a number"; exit 1; }
          echo "ILOADER_CLI_BUILD=$n" >> "$GITHUB_ENV"

      # The same Docker image as a local `make build-cli-linux-docker`: Debian
      # bullseye, so the binary runs on glibc 2.31 and newer.
      - name: build (linux)
        if: matrix.platform == 'linux-amd64'
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg ILOADER_CLI_BUILD="$ILOADER_CLI_BUILD" \
            -f Dockerfile.linux -t iloader-cli-linux .
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" iloader-cli-linux cp /app/target/release/iloader-cli /out/
          cp out/iloader-cli "${{ matrix.asset }}"

      # Windows links OpenSSL statically from the full Win64 install: the
      # vendored openssl-src build produces signatures iOS rejects there.
      - name: build (windows)
        if: matrix.platform == 'windows-amd64'
        shell: bash
        run: |
          set -euo pipefail
          # The newest OpenSSL 3.5 (the long-term support line; openssl-sys
          # rejects OpenSSL 4) from the installer's maker, checked against the
          # SHA-256 it publishes. choco is not used: it installs 4.x by
          # default, and its pinned 3.x packages point at installers the
          # maker has since removed.
          read -r url sum < <(curl -fsSL https://raw.githubusercontent.com/slproweb/opensslhashes/master/win32_openssl_hashes.json | python -c '
          import json, re, sys
          files = json.load(sys.stdin)["files"]
          name = max((n for n in files if re.fullmatch(r"Win64OpenSSL-3_5_\d+\.msi", n)), key=lambda n: int(n.split("_")[2].split(".")[0]))
          print(files[name]["url"], files[name]["sha256"])')
          echo "OpenSSL installer: $url"
          curl -fsSL -o openssl.msi "$url"
          echo "$sum  openssl.msi" | sha256sum -c -
          powershell -NoProfile -Command "\$p = Start-Process msiexec.exe -ArgumentList '/i','openssl.msi','/qn','/norestart' -Wait -PassThru; exit \$p.ExitCode"
          rm openssl.msi
          # The install folder differs between installer versions (OpenSSL,
          # OpenSSL-Win64), and the image may carry an OpenSSL of its own:
          # take the 3.5 install that holds the static x64 /MT libs.
          static=""
          while IFS= read -r candidate; do
            r=${candidate%%/[Ll][Ii][Bb]/*}
            if grep -qE 'OPENSSL_VERSION_STR "3\.5\.' "$r/include/openssl/opensslv.h" 2>/dev/null; then static=$candidate; break; fi
          done < <(find /c/Program\ Files/OpenSSL* /c/OpenSSL* -iname 'libssl_static.lib' 2>/dev/null | grep -i '/x64/MT/' || true)
          if [ -z "$static" ]; then
            echo "::error::no OpenSSL 3.5 with static x64 /MT libs found"
            ls -d /c/Program\ Files/OpenSSL* /c/OpenSSL* 2>/dev/null || true
            grep -H 'OPENSSL_VERSION_STR' /c/Program\ Files/OpenSSL*/include/openssl/opensslv.h 2>/dev/null || true
            find /c/Program\ Files/OpenSSL* /c/OpenSSL* -maxdepth 4 -iname '*.lib' 2>/dev/null | head -40 || true
            exit 1
          fi
          lib=$(dirname "$static")
          root=${lib%%/[Ll][Ii][Bb]/*}
          echo "OpenSSL: $root, libs: $lib"
          export OPENSSL_DIR="$(cygpath -m "$root")"
          export OPENSSL_LIB_DIR="$(cygpath -m "$lib")"
          export OPENSSL_LIBS="libssl_static:libcrypto_static" OPENSSL_STATIC=1 OPENSSL_NO_VENDOR=1
          export CARGO_PROFILE_RELEASE_STRIP=true CARGO_PROFILE_RELEASE_LTO=true CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          cd src-tauri
          cargo build --bin iloader-cli --release --no-default-features --features cli --locked
          cp target/release/iloader-cli.exe "../${{ matrix.asset }}"

      - name: check --version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = linux-amd64 ]; then
            out=$(docker run --rm -v "$PWD:/x" iloader-cli-linux "/x/${{ matrix.asset }}" --version)
          else
            out=$("./${{ matrix.asset }}" --version)
          fi
          echo "$out"
          echo "$out" | grep -q "build $ILOADER_CLI_BUILD protocol " || { echo "::error::--version does not report build $ILOADER_CLI_BUILD"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  draft:
    name: draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: attach to draft cli release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "iloader-cli $TAG" \
              --notes "iloader-cli $TAG. Binaries for Linux, Windows and macOS, and manifest.json."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
