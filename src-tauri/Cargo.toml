[package]
name = "iloader"
version = "1.1.5"
description = "User-friendly sideloader"
authors = ["nab138"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "iloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "iloader-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[features]
default = ["gui"]
gui = ["tauri", "tauri-plugin-opener", "tauri-plugin-store", "tauri-plugin-dialog", "tauri-plugin-process", "tauri-plugin-updater", "tauri-build"]
cli = []

[dependencies]
tauri = { version = "2", features = ["devtools"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idevice = { version = "0.1.50", features = ["usbmuxd", "house_arrest", "afc", "ring"], default-features = false}
isideload = { version = "=0.1.22", features = ["vendored-openssl"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
tauri-plugin-store = { version = "2", optional = true }
futures = "0.3.31"
once_cell = "1.21.3"
tauri-plugin-dialog = { version = "2", optional = true }
reqwest = "0.12.23"
tokio = { version = "1.48.0", features = ["full"] }
tauri-plugin-process = { version = "2", optional = true }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
dirs = "5"
walkdir = "2"
plist = "1"
zsign-rust = "=0.1.7"
zip = "4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

# Vendored fork of the App Store auth crate. Adds app-token caching + retry with
# backoff on Apple's intermittent GrandSlam 503s (see vendored/nab138_icloud_auth).
[patch.crates-io]
nab138_icloud_auth = { path = "../vendored/nab138_icloud_auth" }
# Vendored to present an Android client info to Apple (-80045 since 2026-10-12).
nab138_omnisette = { path = "../vendored/nab138_omnisette" }
